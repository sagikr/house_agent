<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סוכן השוואת מגורים – משגב מול בית קמה</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d2e;
    --bg3: #252840;
    --border: #2e3250;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --cyan: #4fc3f7;
    --yellow: #ffd54f;
    --green: #69f0ae;
    --red: #ff5252;
    --text: #e8eaf6;
    --text2: #9fa8da;
    --dim: #5c6bc0;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.3px;
  }
  header small { color: var(--text2); font-size: 0.78rem; }
  #api-key-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all .2s;
  }
  #api-key-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── MAIN LAYOUT ── */
  main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  aside {
    width: 260px;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 20px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--dim);
    margin-bottom: 4px;
  }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-a { background: var(--cyan); }
  .dot-b { background: var(--yellow); }

  /* Topic progress */
  .topics { display: flex; flex-direction: column; gap: 10px; }
  .topic-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    transition: border-color .3s;
  }
  .topic-item.done { border-color: var(--accent); }
  .topic-item.active { border-color: var(--cyan); }
  .topic-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topic-item.done .topic-name { color: var(--text); }
  .topic-check { color: var(--green); font-size: 0.9rem; }
  .mini-bars { display: flex; flex-direction: column; gap: 3px; }
  .mini-bar-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--dim); }
  .mini-bar-track {
    flex: 1; height: 5px; background: var(--bg);
    border-radius: 3px; overflow: hidden;
  }
  .mini-bar-fill { height: 100%; border-radius: 3px; transition: width .6s ease; }
  .fill-a { background: var(--cyan); }
  .fill-b { background: var(--yellow); }
  .fill-c { background: var(--green); }

  /* Total score */
  .total-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .total-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.82rem; }
  .total-row:last-child { margin-bottom: 0; }
  .total-score {
    font-size: 1.1rem;
    font-weight: 700;
    width: 52px;
    flex-shrink: 0;
  }
  .total-bar-track {
    flex: 1; height: 8px; background: var(--bg);
    border-radius: 4px; overflow: hidden;
  }
  .total-bar-fill { height: 100%; border-radius: 4px; transition: width .8s ease; }

  /* ── CHAT AREA ── */
  #chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    display: flex;
    gap: 12px;
    max-width: 82%;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: none; } }
  .msg.agent { align-self: flex-start; }
  .msg.user  { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0; margin-top: 2px;
  }
  .avatar-agent { background: linear-gradient(135deg, var(--accent), #9c27b0); }
  .avatar-user  { background: linear-gradient(135deg, #0288d1, #00bcd4); }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 0.9rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .msg.agent .bubble {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-top-right-radius: 4px;
    color: var(--text);
  }
  .msg.user .bubble {
    background: var(--accent);
    border-top-left-radius: 4px;
    color: #fff;
  }

  /* typing indicator */
  .typing .bubble { padding: 14px 18px; }
  .dots { display: flex; gap: 5px; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text2);
    animation: bounce 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,80%,100% { transform: scale(1); opacity:.5; }
    40%         { transform: scale(1.3); opacity:1; }
  }

  /* ── OPTIONS (multiple choice) ── */
  .options-wrap {
    padding: 0 24px 16px;
    display: flex; flex-direction: column; gap: 8px;
    animation: fadeIn .25s ease;
  }
  .option-btn {
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 18px;
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    text-align: right;
    transition: all .2s;
    font-family: inherit;
    direction: rtl;
    line-height: 1.4;
  }
  .option-btn:hover {
    border-color: var(--accent);
    background: rgba(108,99,255,.12);
    transform: translateX(-2px);
  }
  .option-btn.selected {
    border-color: var(--accent);
    background: rgba(108,99,255,.22);
    color: var(--text);
  }
  .option-btn.selected::before {
    content: '✓ ';
    color: var(--accent);
    font-weight: bold;
  }
  .option-btn.other {
    border-style: dashed;
    color: var(--text2);
    font-style: italic;
  }
  .options-confirm {
    margin-top: 4px;
    padding: 12px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .2s;
    direction: rtl;
  }
  .options-confirm:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* ── INPUT BAR ── */
  #input-bar {
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #user-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 0.92rem;
    font-family: inherit;
    resize: none;
    min-height: 46px;
    max-height: 120px;
    outline: none;
    transition: border-color .2s;
    direction: rtl;
  }
  #user-input:focus { border-color: var(--accent); }
  #user-input::placeholder { color: var(--dim); }
  #send-btn {
    background: var(--accent);
    border: none;
    border-radius: 12px;
    width: 46px; height: 46px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    flex-shrink: 0;
  }
  #send-btn:hover { background: #7c73ff; transform: scale(1.05); }
  #send-btn:disabled { background: var(--bg3); cursor: not-allowed; transform: none; }
  #send-btn svg { width: 20px; height: 20px; fill: white; }

  /* ── API KEY MODAL ── */
  #modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 300;
    backdrop-filter: blur(4px);
  }
  #modal-overlay.hidden { display: none; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px;
    width: min(440px, 92vw);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .modal h2 { font-size: 1.2rem; margin-bottom: 8px; color: var(--accent); }
  .modal p  { color: var(--text2); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; }
  .modal input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: monospace;
    direction: ltr;
    text-align: left;
    outline: none;
    margin-bottom: 14px;
    transition: border-color .2s;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal .warn {
    background: rgba(255,213,79,.08);
    border: 1px solid rgba(255,213,79,.2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: var(--yellow);
    margin-bottom: 20px;
    text-align: right;
  }
  .modal-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: all .2s;
  }
  .modal-btn:hover { background: #7c73ff; }

  /* ── REPORT VIEW ── */
  #report-view {
    display: none; flex: 1; overflow-y: auto;
    padding: 28px 20px; animation: fadeIn .4s ease;
    background: var(--bg);
  }
  #report-view.visible { display: block; }

  .rpt { max-width: 720px; margin: 0 auto; direction: rtl; }

  /* Verdict hero */
  .rpt-verdict {
    border-radius: 18px; padding: 28px 32px; margin-bottom: 28px;
    text-align: center; position: relative; overflow: hidden;
  }
  .rpt-verdict.tie   { background: linear-gradient(135deg,rgba(255,213,79,.15),rgba(108,99,255,.1)); border: 1.5px solid rgba(255,213,79,.4); }
  .rpt-verdict.win-a { background: linear-gradient(135deg,rgba(79,195,247,.15),rgba(108,99,255,.1)); border: 1.5px solid rgba(79,195,247,.4); }
  .rpt-verdict.win-b { background: linear-gradient(135deg,rgba(255,213,79,.15),rgba(255,101,132,.08)); border: 1.5px solid rgba(255,213,79,.4); }
  .rpt-verdict.win-c { background: linear-gradient(135deg,rgba(0,230,118,.15),rgba(108,99,255,.08)); border: 1.5px solid rgba(0,230,118,.4); }
  .rpt-verdict-emoji { font-size: 2.4rem; margin-bottom: 8px; }
  .rpt-verdict-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 6px; }
  .rpt-verdict.tie   .rpt-verdict-title { color: var(--yellow); }
  .rpt-verdict.win-a .rpt-verdict-title { color: var(--cyan); }
  .rpt-verdict.win-b .rpt-verdict-title { color: var(--yellow); }
  .rpt-verdict.win-c .rpt-verdict-title { color: var(--green); }
  .rpt-verdict-sub  { color: var(--text2); font-size: 0.88rem; }

  /* Section label */
  .rpt-section-label {
    font-size: 0.72rem; font-weight: 700; letter-spacing: .08em;
    color: var(--dim); text-transform: uppercase; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .rpt-section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  /* Total scores */
  .rpt-totals {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 24px; margin-bottom: 28px;
  }
  .rpt-total-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .rpt-total-row:last-child { margin-bottom: 0; }
  .rpt-total-name { width: 140px; flex-shrink: 0; font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rpt-total-track { flex: 1; height: 16px; background: var(--bg3); border-radius: 8px; overflow: hidden; }
  .rpt-total-fill  { height: 100%; border-radius: 8px; transition: width 1.1s cubic-bezier(.4,0,.2,1); width: 0; }
  .rpt-total-fill.a { background: linear-gradient(90deg,var(--cyan),#5bc8fa); }
  .rpt-total-fill.b { background: linear-gradient(90deg,var(--yellow),#ffd54f); }
  .rpt-total-fill.c { background: linear-gradient(90deg,var(--green),#69f0ae); }
  .rpt-total-val  { width: 48px; font-weight: 800; font-size: 1.05rem; flex-shrink: 0; }

  /* Score grid */
  .rpt-scores { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .rpt-score-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 18px;
    transition: border-color .2s;
  }
  .rpt-score-card:hover { border-color: var(--accent); }
  .rpt-score-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .rpt-score-name { font-size: 0.9rem; font-weight: 700; }
  .rpt-score-weight {
    background: rgba(108,99,255,.15); color: var(--accent);
    border-radius: 20px; padding: 2px 10px; font-size: 0.72rem; font-weight: 600;
  }
  .rpt-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .rpt-bar-lbl { width: 22px; font-size: 0.78rem; font-weight: 700; flex-shrink: 0; }
  .rpt-bar-track { flex: 1; height: 9px; background: var(--bg3); border-radius: 5px; overflow: hidden; }
  .rpt-bar-fill { height: 100%; border-radius: 5px; transition: width .9s cubic-bezier(.4,0,.2,1); width: 0; }
  .rpt-bar-fill.a { background: var(--cyan); }
  .rpt-bar-fill.b { background: var(--yellow); }
  .rpt-bar-fill.c { background: var(--green); }
  .rpt-bar-val { width: 36px; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; text-align: left; }
  .rpt-reason { font-size: 0.77rem; color: var(--dim); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); line-height: 1.45; }

  /* Option summary cards */
  .rpt-summaries { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 14px; margin-bottom: 28px; }
  .rpt-summary-card { background: var(--bg2); border-radius: 14px; padding: 18px; }
  .rpt-summary-card.s-a { border: 1.5px solid rgba(79,195,247,.4); }
  .rpt-summary-card.s-b { border: 1.5px solid rgba(255,213,79,.4); }
  .rpt-summary-card.s-c { border: 1.5px solid rgba(0,230,118,.4); }
  .rpt-summary-tag { font-size: 0.72rem; font-weight: 700; margin-bottom: 6px; }
  .s-a .rpt-summary-tag { color: var(--cyan); }
  .s-b .rpt-summary-tag { color: var(--yellow); }
  .s-c .rpt-summary-tag { color: var(--green); }
  .rpt-summary-card p { font-size: 0.83rem; color: var(--text2); line-height: 1.6; margin: 0; }

  /* Info cards */
  .rpt-info-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
  .rpt-info-card { background: var(--bg2); border-radius: 12px; padding: 16px 20px; }
  .rpt-info-card.tension { border-right: 4px solid var(--accent2); }
  .rpt-info-card.advice  { border-right: 4px solid var(--accent); }
  .rpt-info-title { font-size: 0.78rem; font-weight: 700; margin-bottom: 6px; }
  .tension .rpt-info-title { color: var(--accent2); }
  .advice  .rpt-info-title { color: var(--accent); }
  .rpt-info-card p { font-size: 0.87rem; color: var(--text); line-height: 1.65; margin: 0; }

  /* Actions */
  .rpt-actions { display: flex; gap: 10px; justify-content: center; margin-top: 8px; padding-bottom: 32px; }
  .rpt-btn-restart {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
    padding: 10px 24px; border-radius: 10px; cursor: pointer;
    font-size: 0.88rem; transition: all .2s; font-family: inherit;
  }
  .rpt-btn-restart:hover { border-color: var(--accent); color: var(--accent); }
  .rpt-btn-chat {
    background: var(--accent); color: #fff; border: none;
    padding: 10px 24px; border-radius: 10px; cursor: pointer;
    font-size: 0.88rem; font-weight: 700; transition: all .2s; font-family: inherit;
  }
  .rpt-btn-chat:hover { background: #7c73ff; }

  @keyframes barGrow { from { width: 0 } }

  /* ── WELCOME OVERLAY ── */
  #welcome-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(6px);
  }
  #welcome-overlay.hidden { display: none; }
  .welcome-box {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 22px; padding: 36px 32px;
    width: min(520px, 94vw); box-shadow: var(--shadow);
    text-align: center;
  }
  .welcome-box .w-icon { font-size: 3rem; margin-bottom: 12px; }
  .welcome-box h2 { font-size: 1.3rem; color: var(--accent); margin-bottom: 8px; }
  .welcome-box p  { color: var(--text2); font-size: 0.85rem; margin-bottom: 26px; line-height: 1.6; }
  .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 4px; }
  .mode-card {
    background: var(--bg3); border: 2px solid var(--border);
    border-radius: 16px; padding: 22px 16px; cursor: pointer;
    transition: all .2s; text-align: center;
  }
  .mode-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .mode-card .mc-icon { font-size: 2rem; margin-bottom: 10px; }
  .mode-card h3 { font-size: 0.92rem; font-weight: 700; margin-bottom: 6px; }
  .mode-card p  { font-size: 0.76rem; color: var(--text2); line-height: 1.45; }

  /* ── OPTIONS FORM ── */
  .options-form { text-align: right; }
  .options-form h3 { font-size: 1rem; margin-bottom: 6px; color: var(--text); }
  .options-form p  { font-size: 0.82rem; color: var(--text2); margin-bottom: 18px; }
  .opt-input-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .opt-input-row { display: flex; align-items: center; gap: 10px; }
  .opt-label {
    font-size: 0.78rem; font-weight: 700; min-width: 60px;
    color: var(--text2);
  }
  .opt-input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text);
    font-size: 0.88rem; font-family: inherit; direction: rtl;
    outline: none; transition: border-color .2s;
  }
  .opt-input:focus { border-color: var(--accent); }
  .opt-input::placeholder { color: var(--dim); }
  .add-option-btn {
    background: none; border: 1px dashed var(--border); border-radius: 10px;
    color: var(--dim); padding: 9px; cursor: pointer; width: 100%;
    font-size: 0.82rem; transition: all .2s; font-family: inherit;
  }
  .add-option-btn:hover { border-color: var(--accent); color: var(--accent); }
  .form-nav { display: flex; gap: 10px; margin-top: 20px; }
  .btn-back-form {
    background: none; border: 1px solid var(--border); border-radius: 10px;
    color: var(--text2); padding: 11px 20px; cursor: pointer;
    font-size: 0.88rem; transition: all .2s; font-family: inherit;
  }
  .btn-back-form:hover { border-color: var(--text2); color: var(--text); }
  .btn-start {
    flex: 1; background: var(--accent); color: white; border: none;
    border-radius: 10px; padding: 12px; font-size: 0.95rem;
    font-weight: 700; cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .btn-start:hover { background: #7c73ff; }

</head>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const API_URL     = '/api/proxy';

// ─── Debug ────────────────────────────────────────────────────────────────────
const DEBUG = false;
function dbg(msg, color = '#e6edf3', data = null) {
  if (!DEBUG) return;
  const panel = document.getElementById('debug-panel');
  const log   = document.getElementById('debug-log');
  if (!panel || !log) return;
  panel.style.display = 'block';
  const row = document.createElement('div');
  row.style.cssText = `color:${color};border-bottom:1px solid #21262d;padding:1px 0`;
  const ts = new Date().toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  row.textContent = `[${ts}] ${msg}` + (data !== null ? ' → ' + JSON.stringify(data) : '');
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}
function dbgErr(msg, data = null) { dbg('❌ ' + msg, '#f85149', data); }
function dbgOk(msg, data = null)  { dbg('✅ ' + msg, '#3fb950', data); }
function dbgInfo(msg, data = null){ dbg('ℹ️ ' + msg, '#58a6ff', data); }
const CATEGORIES = ['איכות חיים', 'קהילה', 'חינוך', 'נגישות לעבודה', 'כלכלי', 'בטחון אישי', 'תרבות ופנאי', 'בריאות', 'קרבה למשפחה וחברים'];

const CATEGORIES_EN   = ['Quality of Life','Community','Education','Work Accessibility','Financial','Personal Safety','Culture & Leisure','Health','Proximity to Family & Friends'];
const OPT_KEYS   = ['a', 'b', 'c'];

// ─── Language & Strings ───────────────────────────────────────────────────────
let currentLang = 'he';
const STRINGS = {
  he: {
    landingTitle:'יועץ מגורים חכם', landingTagline:'ייעוץ מותאם אישית למציאת הבית הנכון לך',
    landingF1:'🔍 השוואה חכמה בין מספר מקומות',
    landingF2:'❓ שאלות המותאמות לפרופיל המשפחה שלך',

// ─── Session persistence ──────────────────────────────────────────────────────
const SESSIONS_KEY = 'housing_sessions';

function allSessions() {
  try { return JSON.parse(localStorage.getItem(SESSIONS_KEY) || '{}'); } catch { return {}; }
}

function saveSession() {
  if (!currentUsername) return;
  const sessions = allSessions();
  sessions[currentUsername] = {
    savedAt:      new Date().toISOString(),
    messages,
    scores,
    reportData,
    appMode,
    appOptions,
    appDepth,
    appWeightsMap,
    appPhase,
    appProfile,
    categories:     [...CATEGORIES],
    skippedTopics:  [...skippedTopics],
  };
  localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
}

function loadSession(username) {
  const s = allSessions()[username];
  if (!s) return false;
  messages      = s.messages      || [];
  scores        = s.scores        || {};
  reportData    = s.reportData    || {};
  appMode       = s.appMode       || null;
  appOptions    = s.appOptions    || [];
  appDepth      = s.appDepth      || 'full';
  appWeightsMap = s.appWeightsMap || {};
  appPhase      = s.appPhase      || 'profile';
  appProfile    = s.appProfile    || null;
  if (s.categories?.length) {
    CATEGORIES.splice(0, CATEGORIES.length, ...s.categories);
  }
  skippedTopics = new Set(s.skippedTopics || []);
  skippedTopics.forEach(cat => {
    const el = document.getElementById(`topic-${cat}`);
    if (el) {
      el.classList.add('skipped');
      const check = document.getElementById(`check-${cat}`);
      if (check) { check.style.display = 'inline'; check.textContent = '—'; check.style.color = 'var(--dim)'; }
    }
  });
  return true;
}

function deleteSession(username) {
  const sessions = allSessions();
  delete sessions[username];
  localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
}

function rebuildSystemPrompt() {
  switch (appPhase) {
    case 'profile':   SYSTEM_PROMPT = buildProfilePrompt();             break;
    case 'questions': SYSTEM_PROMPT = buildQuestionsPrompt(appProfile); break;
    case 'report':    SYSTEM_PROMPT = buildReportPrompt(appProfile);    break;
    case 'free':      SYSTEM_PROMPT = buildFreeChatPrompt(appProfile);  break;
  }
}

function saveEditedProfile() {
  if (!appProfile) appProfile = {};
  if (!appProfile.members) appProfile.members = [];

  // Collect member edits
  document.querySelectorAll('#edit-profile-overlay input[data-mi]').forEach(inp => {
    const i = +inp.dataset.mi;
    const f = inp.dataset.field;
    if (!appProfile.members[i]) appProfile.members[i] = {};
    appProfile.members[i][f] = inp.value.trim();
    if (f === 'age') appProfile.members[i][f] = +inp.value || 0;
  });

  // Kids ages
  const kidsVal = document.getElementById('edit-kid-ages')?.value.trim();
  if (kidsVal) {
    appProfile.kid_ages = kidsVal.split(',').map(s => +s.trim()).filter(n => !isNaN(n) && n > 0);
    appProfile.has_kids = appProfile.kid_ages.length > 0;
  }

  // Rebuild summary
  const names = appProfile.members.map(m => `${m.role||''} (${m.profession||''}, ${m.work_location||''})`).join('; ');
  const kids  = appProfile.kid_ages?.length ? `, ילדים בגילאי ${appProfile.kid_ages.join(', ')}` : '';
  appProfile.summary = names + kids;

  // Rebuild questions system prompt with updated profile
  SYSTEM_PROMPT = buildQuestionsPrompt(appProfile);
  saveSession();

  document.getElementById('edit-profile-overlay').remove();

  // Inject a brief note into chat
  addMessage('agent', `✅ הפרטים עודכנו. השאלות הבאות יתחשבו במידע המעודכן.`);
}

// ─── Markers ──────────────────────────────────────────────────────────────────
const SCORE_RE          = /##SCORE##\s*(\{[\s\S]*?\})/g;
const REPORT_RE         = /##REPORT##\s*(\{[\s\S]*?\})/g;
const QUESTION_RE       = /##QUESTION##\s*(\{[\s\S]*?\})/;
const QUESTIONS_DONE_RE = /##QUESTIONS_DONE##/;

function resumeSession() {
  if (!loadSession(currentUsername)) { showWelcome(); return; }

  buildTopicsSidebar();
  rebuildSystemPrompt();
  updatePhaseBar();

  // Restore sidebar legend
  if (appMode === 'compare' && appOptions.length) {
    const legendEl = document.querySelector('.legend');
    if (legendEl) {
      const colors = ['var(--cyan)', 'var(--yellow)', 'var(--green)'];
      legendEl.innerHTML = appOptions.map((o, i) => `
        <div class="legend-item">
          <div class="dot" style="background:${colors[i]}"></div>
          <span style="font-size:.8rem">${['א׳','ב׳','ג׳'][i]} – ${o}</span>
        </div>`).join('');
    }
    document.getElementById('header-subtitle').textContent =
      appOptions.map((o,i) => `${['א׳','ב׳','ג׳'][i]}: ${o}`).join(' | ');
  } else if (appMode === 'guide') {
    const legendEl = document.querySelector('.legend');
    if (legendEl) legendEl.innerHTML = `<div class="legend-item" style="color:var(--text2);font-size:.82rem">${S('generalMode')}</div>`;
    document.getElementById('header-subtitle').textContent = S('generalSubtitle');
  }

  // Show/hide 3rd total bar
  const rowC = document.getElementById('total-row-c');
  if (rowC) rowC.style.display = appOptions.length >= 3 ? '' : 'none';

  // Restore scores to sidebar
  Object.entries(scores).forEach(([cat, s]) => updateSidebarScore(cat, s.a, s.b, s.c));
  updateQuestionsProgress();

  // Restore chat messages (strip internal markers from display)
  document.getElementById('messages').innerHTML = '';
  messages.forEach(m => {
    if (m.role === 'system') return;
    let display = m.content;
    if (m.role === 'assistant') {
      display = m.content
        .replace(new RegExp(SCORE_RE.source, 'g'), '')
        .replace(new RegExp(REPORT_RE.source, 'g'), '')
        .replace(QUESTION_RE, '')
        .replace(/##PROFILE##\s*\{[\s\S]*?\}/, '')
        .replace(QUESTIONS_DONE_RE, '')
        .trim();
    }
    if (display) addMessage(m.role === 'user' ? 'user' : 'agent', display);
  });

  // If mid-report phase, show report
  if (appPhase === 'report' || appPhase === 'free') {
    if (Object.keys(reportData).length) showReport();
    if (appPhase === 'free') {
      document.getElementById('user-input').placeholder = S('freePH');
    }
  }

  document.getElementById('welcome-overlay').classList.add('hidden');
  setInputDisabled(false);
  document.getElementById('user-input').focus();
}

function weightRow(label, defaultVal, removable = false) {
  const levels  = [S('wLow'), S('wMid'), S('wHigh'), S('wCrit')];
  const classes = ['w-low', 'w-mid', 'w-high', 'w-crit'];
  const btns = levels.map((l, i) =>
    `<button class="weight-btn ${classes[i]}${l === defaultVal ? ' sel' : ''}"
      onclick="selectWeight(this)">${l}</button>`
  ).join('');
  const removeBtn = removable
    ? `<button class="weight-remove" onclick="this.closest('.weight-row').remove()" title="Remove">✕</button>`
    : '';
  return `<div class="weight-row" data-topic="${label}">
    <div class="weight-label">${catDisplay(label)}</div>
    <div class="weight-btns">${btns}</div>
    ${removeBtn}
  </div>`;
}

function selectWeight(btn) {
  const row = btn.closest('.weight-row');
  row.querySelectorAll('.weight-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}

function selectDepth(val) {
  appDepth = val;
  document.getElementById('depth-quick').classList.toggle('sel', val === 'quick');
  document.getElementById('depth-full').classList.toggle('sel', val === 'full');
}

function addCustomTopic() {
  _customTopicCount++;
  const id = `custom-${_customTopicCount}`;
  const list = document.getElementById('weights-list');
  const div = document.createElement('div');
  div.innerHTML = `<div class="weight-row" data-topic-custom="${id}">
    <div class="weight-label"><input type="text" placeholder="${currentLang==='he'?'נושא חדש...':'New topic...'}" maxlength="30" oninput="this.closest('[data-topic-custom]').dataset.topic=this.value"></div>
    <div class="weight-btns">
      <button class="weight-btn w-low" onclick="selectWeight(this)">${S('wLow')}</button>
      <button class="weight-btn w-mid sel" onclick="selectWeight(this)">${S('wMid')}</button>
      <button class="weight-btn w-high" onclick="selectWeight(this)">${S('wHigh')}</button>
      <button class="weight-btn w-crit" onclick="selectWeight(this)">${S('wCrit')}</button>
    </div>
    <button class="weight-remove" onclick="this.closest('.weight-row').remove()" title="הסר">✕</button>
  </div>`;
  list.appendChild(div.firstElementChild);
  list.scrollTop = list.scrollHeight;
  list.querySelector(`[data-topic-custom="${id}"] input`)?.focus();
}

function confirmWeights() {
  const weightsMap = {};
  document.querySelectorAll('#weights-list .weight-row').forEach(row => {
    const topic = row.dataset.topic?.trim();
    if (!topic) return;
    const sel = row.querySelector('.weight-btn.sel');
    weightsMap[topic] = sel ? sel.textContent.trim() : 'חשוב';
  });

  // Store globally for use by agents 2 & 3
  appWeightsMap = weightsMap;

  // Add custom topics to sidebar + CATEGORIES
  Object.keys(weightsMap).filter(t => !CATEGORIES.includes(t))
    .forEach(t => CATEGORIES.push(t));
  buildTopicsSidebar();

  // Update sidebar legend
  if (appMode === 'compare') {
    const legendEl = document.querySelector('.legend');
    if (legendEl) {
      const colors = ['var(--cyan)', 'var(--yellow)', 'var(--green)'];

      appOptions.map((o,i) => `${['א׳','ב׳','ג׳'][i]}: ${o}`).join(' | ');

    if (legendEl) legendEl.innerHTML = `
      <div class="legend-item" style="color:var(--text2);font-size:.82rem">${S('generalMode')}</div>`;

  const rowC = document.getElementById('total-row-c');
  if (rowC) rowC.style.display = appOptions.length >= 3 ? '' : 'none';

  document.getElementById('welcome-overlay').classList.add('hidden');
  initConversation();
}

function sidebarOptionCount() {
  return Math.max(appOptions.length, 2);
}

function buildTopicsSidebar() {
  const n    = sidebarOptionCount();
  const list = document.getElementById('topics-list');
  const clickable = appPhase === 'questions';
  const hint = document.getElementById('topic-hint');
  if (hint) { hint.textContent = S('topicHint'); hint.style.display = clickable ? '' : 'none'; }
  list.innerHTML = CATEGORIES.map(cat => {
    const bars = OPT_KEYS.slice(0, n).map((k, i) => `
      <div class="mini-bar-row">
        <span>${OPT_LABELS[i]}</span>
        <div class="mini-bar-track"><div class="mini-bar-fill ${OPT_FILLS[i]}" id="bar-${k}-${cat}" style="width:0"></div></div>
        <span id="val-${k}-${cat}">—</span>
      </div>`).join('');
    return `
    <div class="topic-item${clickable ? ' clickable' : ''}" id="topic-${cat}"
      ${clickable ? `onclick="clickTopic('${cat.replace(/'/g,"\\\'")}')"` : ''}>
      <div class="topic-name">
        <span>${catDisplay(cat)}</span>
        <span class="topic-check" id="check-${cat}" style="display:none">✓</span>
      </div>
      <div class="mini-bars">${bars}</div>
    </div>`;
  }).join('');
}

function updateSidebarScore(cat, scoreA, scoreB, scoreC) {
  const item  = document.getElementById(`topic-${cat}`);
  if (!item) return;
  item.classList.add('done');
  const check = document.getElementById(`check-${cat}`);
  if (check) check.style.display = 'inline';

  const vals = [scoreA, scoreB, scoreC];
  OPT_KEYS.slice(0, sidebarOptionCount()).forEach((k, i) => {
    const bar = document.getElementById(`bar-${k}-${cat}`);
    const val = document.getElementById(`val-${k}-${cat}`);
    if (bar) bar.style.width = ((vals[i] || 0) * 10) + '%';
    if (val) val.textContent = vals[i] ?? '—';
  });
  updateTotalScore();
}

function setActiveTopic(cat) {
  CATEGORIES.forEach(c => {
    const el = document.getElementById(`topic-${c}`);
    if (el && !el.classList.contains('done')) el.classList.remove('active');
  });
  const el = document.getElementById(`topic-${cat}`);
  if (el && !el.classList.contains('done')) el.classList.add('active');
}

function updateQuestionsProgress() {
  const total = CATEGORIES.filter(c => !skippedTopics.has(c)).length;
  const done  = Object.keys(scores).length;
  const pct   = total ? (done / total * 100) : 0;
  const label = `${done}/${total}`;

  // Chat bar
  const bar = document.getElementById('questions-progress-bar');
  if (bar) {
    bar.style.display = appPhase === 'questions' ? '' : 'none';
    const fill  = document.getElementById('qpb-fill');
    const count = document.getElementById('qpb-count');
    if (fill)  fill.style.width = pct + '%';
    if (count) count.textContent = label;
  }

  // Sidebar bar
  const sbBar = document.getElementById('sb-questions-progress');
  if (sbBar) {
    sbBar.style.display = appPhase === 'questions' ? '' : 'none';
    const fill  = document.getElementById('sb-qpb-fill');
    const count = document.getElementById('sb-qpb-count');
    if (fill)  fill.style.width = pct + '%';
    if (count) count.textContent = label;
  }
}

function updateTotalScore() {
  const vals = Object.values(scores);
  if (!vals.length) return;
  const totalW = vals.reduce((s, v) => s + v.weight, 0);
  OPT_KEYS.slice(0, sidebarOptionCount()).forEach((k, i) => {
    const w = vals.reduce((s, v) => s + (v[k] || 0) * v.weight, 0) / totalW * 10;
    const el = document.getElementById(`total-${k}`);
    const bar = document.getElementById(`total-bar-${k}`);
    if (el)  el.textContent = w.toFixed(1);
    if (bar) bar.style.width = w + '%';
  });
}

let _activeTtsBtn = null;
function speak(text, btn) {
  if (!window.speechSynthesis) return;
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    if (_activeTtsBtn) { _activeTtsBtn.classList.remove('speaking'); _activeTtsBtn.textContent = '🔊'; }
    if (_activeTtsBtn === btn) { _activeTtsBtn = null; return; }
  }
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = currentLang === 'he' ? 'he-IL' : 'en-US';
  utt.rate = 1.0;
  utt.onend = () => { btn.classList.remove('speaking'); btn.textContent = '🔊'; _activeTtsBtn = null; };
  utt.onerror = () => { btn.classList.remove('speaking'); btn.textContent = '🔊'; _activeTtsBtn = null; };
  _activeTtsBtn = btn;
  btn.classList.add('speaking');
  btn.textContent = '⏹';
  window.speechSynthesis.speak(utt);
}

// Extract the JSON object that starts after a marker tag, using balanced-brace
// counting so nested objects (like ##PROFILE##) are handled correctly.
function extractMarkerJSON(text, tag) {
  const idx = text.indexOf(tag);
  if (idx === -1) return null;
  const start = text.indexOf('{', idx + tag.length);
  if (start === -1) return null;
  let depth = 0;
  for (let i = start; i < text.length; i++) {
    const c = text[i];
    if (c === '{') depth++;
    else if (c === '}') {
      depth--;
      if (depth === 0) {
        try { return JSON.parse(text.slice(start, i + 1)); }
        catch { return null; }
      }
    }
  }
  return null;
}

function parseMarkers(text) {
  let reportReady   = false;
  let questionData  = null;
  let profileData   = null;
  let questionsDone = false;

  for (const m of text.matchAll(new RegExp(SCORE_RE.source, 'g'))) {
    try {
      const d   = JSON.parse(m[1]);
      const cat = d.category;
      if (cat && !scores[cat]) {
        scores[cat] = {
          a: +d.score_a || 0, b: +d.score_b || 0, c: d.score_c != null ? +d.score_c : undefined,
          weight: +d.weight, reason: d.reason || ''
        };
        if (!CATEGORIES.includes(cat)) CATEGORIES.push(cat);
        updateSidebarScore(cat, scores[cat].a, scores[cat].b, scores[cat].c);
        updateQuestionsProgress();
      }
    } catch {}
  }

  for (const m of text.matchAll(new RegExp(REPORT_RE.source, 'g'))) {
    try {
      Object.assign(reportData, JSON.parse(m[1]));
      reportReady = true;
    } catch {}
  }

  const qm = text.match(QUESTION_RE);
  if (qm) { try { questionData = JSON.parse(qm[1]); } catch {} }

  // Use balanced-brace extraction for nested JSON (##PROFILE##)
  profileData = extractMarkerJSON(text, '##PROFILE##');

  if (QUESTIONS_DONE_RE.test(text)) questionsDone = true;

  const clean = text
    .replace(new RegExp(SCORE_RE.source, 'g'), '')
    .replace(new RegExp(REPORT_RE.source, 'g'), '')
    .replace(QUESTION_RE, '')
    .replace(/##PROFILE##\s*\{[\s\S]*\}/, '')   // greedy — strip full nested JSON
    .replace(QUESTIONS_DONE_RE, '')
    .trim();
  return { clean, reportReady, questionData, profileData, questionsDone };
}

// ─── API Call (streaming) ─────────────────────────────────────────────────────
async function callClaude(userMessage) {
  dbgInfo('callClaude: שולח', { phase: appPhase, msgLen: userMessage.length, totalMsgs: messages.length });
  messages.push({ role: 'user', content: userMessage });

  const response = await fetch(API_URL, {
    method: 'POST',
    headers: {
      ...(!USING_PROXY && { 'x-api-key': apiKey }),
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 2048,
      system: SYSTEM_PROMPT,
      messages,
      stream: true,
    }),
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    dbgErr('callClaude: HTTP שגיאה', { status: response.status, msg: err?.error?.message });
    throw new Error(err?.error?.message || `HTTP ${response.status}`);
  }
  dbgOk('callClaude: HTTP OK', { status: response.status });

  // ── SSE streaming ──────────────────────────────────────────────────────────
  removeTyping();
  const bubble = addMessage('agent', '');
  let fullText = '';

  const reader  = response.body.getReader();
  const decoder = new TextDecoder();

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    const chunk = decoder.decode(value, { stream: true });
    for (const line of chunk.split('\n')) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') break;
      try {
        const ev = JSON.parse(data);
        if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
          fullText += ev.delta.text;
          const { clean } = parseMarkers(fullText);
          bubble.textContent = clean;
          document.getElementById('messages').scrollTop = 9999;
        }
      } catch {}
    }
  }

  dbgInfo('callClaude: סטרימינג הסתיים', { fullTextLen: fullText.length });
  dbgInfo('callClaude: תגובה גולמית (200 תווים ראשונים)', { raw: fullText.slice(0, 200) });
  const hasQuestion = fullText.includes('##QUESTION##');
  const hasProfile  = fullText.includes('##PROFILE##');
  const hasScore    = fullText.includes('##SCORE##');
  const hasDone     = fullText.includes('##QUESTIONS_DONE##');
  dbgInfo('callClaude: markers', { hasQuestion, hasProfile, hasScore, hasDone });

  const { clean, reportReady, questionData, profileData, questionsDone } = parseMarkers(fullText);
  dbgInfo('parseMarkers תוצאות', { reportReady, questionsDone, hasQuestionData: !!questionData, hasProfileData: !!profileData, questionData });
  bubble.textContent = clean;
  messages.push({ role: 'assistant', content: fullText });
  saveSession(); // auto-save after every response

  // ── Phase transitions ───────────────────────────────────────────────────────
  if (appPhase === 'profile') {
    if (profileData) {
      appProfile    = profileData;
      appPhase      = 'questions';
      SYSTEM_PROMPT = buildQuestionsPrompt(appProfile);
      updatePhaseBar();
      buildTopicsSidebar(); // enable clickable topics
      updateQuestionsProgress();
      document.getElementById('user-input').placeholder = S('inputPH');
      setInputDisabled(false);
      document.getElementById('user-input').focus();
      return;
    }
    // Fallback: if profile agent collected enough (≥3 user turns) but forgot the marker,
    // force-extract a minimal profile from conversation and move on.
    const userTurns = messages.filter(m => m.role === 'user').length;
    if (userTurns >= 4) {
      appProfile    = { summary: 'פרופיל נאסף מהשיחה', members: [] };
      appPhase      = 'questions';
      SYSTEM_PROMPT = buildQuestionsPrompt(appProfile);
      updatePhaseBar();
      buildTopicsSidebar(); // enable clickable topics
      updateQuestionsProgress();
      document.getElementById('user-input').placeholder = S('inputPH');
      setInputDisabled(false);
      document.getElementById('user-input').focus();
      return;
    }
  }

  if (appPhase === 'questions' && questionsDone) {
    appPhase      = 'report';
    SYSTEM_PROMPT = buildReportPrompt(appProfile);
    updatePhaseBar();
    setInputDisabled(true);
    showTyping();
    try { await callClaude('אנא כתוב את הסיכום המלא עם ההמלצות, הפערים ושאלות ההמשך.'); }
    catch(e) { removeTyping(); addMessage('agent', `שגיאה: ${e.message}`); setInputDisabled(false); }
    return;
  }

  if (reportReady) {
    showReport();
    appPhase      = 'free';
    SYSTEM_PROMPT = buildFreeChatPrompt(appProfile);
    updatePhaseBar();
    document.getElementById('messages').style.display = '';
    document.getElementById('input-bar').style.display = '';
    document.getElementById('user-input').placeholder = S('freePH');
    setInputDisabled(false);
    return;
  }

  // ── Questions phase: after a topic is scored → show topic picker
  if (appPhase === 'questions' && fullText.includes('##SCORE##') && !questionData) {
    dbgOk('callClaude: נושא הושלם → topic picker');
    showTopicPicker();
    return;
  }

  if (questionData) {
    dbgOk('showOptions: קורא עם אפשרויות', { count: (questionData.options||[]).length, options: questionData.options });
    showOptions(questionData.options || []);
  } else {
    dbgInfo('callClaude: אין questionData → מפעיל input רגיל');
    setInputDisabled(false);
    document.getElementById('user-input').focus();
  }
}

function showOptions(options) {
  dbgInfo('showOptions: נכנס', { optionsCount: options.length });

  document.getElementById('input-bar').style.display = 'none';

  const wrap = document.createElement('div');
  wrap.className = 'options-wrap';
  wrap.id = 'options-wrap';

  const isOther = opt => opt.startsWith('אחר');

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (isOther(opt) ? ' other' : '');
    btn.textContent = opt;

    if (isOther(opt)) {
      btn.onclick = () => {
        removeOptions();
        setInputDisabled(false);
        document.getElementById('user-input').focus();
      };
    } else {
      btn.onclick = () => {
        btn.classList.toggle('selected');
        confirmBtn.disabled = wrap.querySelectorAll('.option-btn.selected').length === 0;
      };
    }

    wrap.appendChild(btn);
  });

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'options-confirm';
  confirmBtn.textContent = 'שלח תשובה';
  confirmBtn.disabled = true;
  confirmBtn.onclick = () => confirmSelection(wrap);
  wrap.appendChild(confirmBtn);

  const chatWrap = document.getElementById('chat-wrap');
  const inputBar = document.getElementById('input-bar');
  if (!chatWrap) { dbgErr('showOptions: chat-wrap לא נמצא!'); return; }
  if (!inputBar) { dbgErr('showOptions: input-bar לא נמצא!'); return; }
  chatWrap.insertBefore(wrap, inputBar);
  document.getElementById('messages').scrollTop = 9999;
  dbgOk('showOptions: נוסף ל-DOM', { wrapId: wrap.id, childrenCount: wrap.children.length });
}

function removeOptions() {
  document.getElementById('options-wrap')?.remove();
  removeTopicPicker();
}

async function confirmSelection(wrap) {
  const selected = [...wrap.querySelectorAll('.option-btn.selected')]
    .map(b => b.textContent.replace(/^✓\s*/, ''));
  if (selected.length === 0) return;

  const text = selected.join(', ');
  removeOptions();
  addMessage('user', text);
  setInputDisabled(true);
  showTyping();

  try {
    await callClaude(text);
  } catch (e) {
    removeTyping();
    addMessage('agent', `שגיאה: ${e.message}`);
    setInputDisabled(false);
  }
}

// ─── Conversation init ────────────────────────────────────────────────────────
async function initConversation() {
  dbgInfo('initConversation: מתחיל', { mode: appMode, options: appOptions });
  // Start at phase 1: profile agent
  appPhase      = 'profile';
  appProfile    = null;
  SYSTEM_PROMPT = buildProfilePrompt();
  updatePhaseBar();

  setInputDisabled(true);
  showTyping();
  try {
    await callClaude('התחל את השיחה בבקשה.');
  } catch (e) {
    messages = []; // reset so user can restart by changing the key
    dbgErr('initConversation: שגיאה', { msg: e.message });
    removeTyping();
    addMessage('agent', `שגיאה: ${e.message}\n\nבדוק שה-API key תקין ויש לך חיבור לאינטרנט. לאחר תיקון המפתח, לחץ על 🔑 החלף מפתח ובחר שם משתמש מחדש.`);
    setInputDisabled(false);
  }
}

// ─── Send message ─────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('user-input');
  const text  = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  autoResize(input);
  addMessage('user', text);
  setInputDisabled(true);
  showTyping();

  try {
    await callClaude(text);
    setInputDisabled(false);
    input.focus();
  } catch (e) {
    removeTyping();
    addMessage('agent', `שגיאה: ${e.message}\n\nבדוק שה-API key תקין ויש לך חיבור לאינטרנט.`);
    setInputDisabled(false);
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function setInputDisabled(val) {
  isLoading = val;
  document.getElementById('user-input').disabled = val;
  document.getElementById('send-btn').disabled   = val;
}

// ─── Final Report ─────────────────────────────────────────────────────────────
function showReport() {
  document.getElementById('messages').style.display  = 'none';
  document.getElementById('input-bar').style.display = 'none';
  const rv = document.getElementById('report-view');
  rv.classList.add('visible');

  const vals      = Object.values(scores);
  const totalW    = vals.reduce((s, v) => s + v.weight, 0) || 1;
  const n         = Math.max(appOptions.length, 2);
  const optColors = ['var(--cyan)', 'var(--yellow)', 'var(--green)'];
  const optFills  = ['a', 'b', 'c'];
  const optLabels = ['א׳', 'ב׳', 'ג׳'];
  const optNames  = ['א׳','ב׳','ג׳'].map((l,i) => appOptions[i] || `אפשרות ${l}`);

  // Weighted total per option
  const totals = OPT_KEYS.slice(0, n).map(k =>
    vals.reduce((s, v) => s + (v[k] || 0) * v.weight, 0) / totalW * 10
  );
  const maxTotal = Math.max(...totals);
  const winIdx   = totals.indexOf(maxTotal);
  const runnerUp = Math.max(...totals.filter((_, i) => i !== winIdx));
  const diff     = maxTotal - runnerUp;
  const isTie    = diff < 0.5;

  const verdictCls   = isTie ? 'tie' : `win-${optFills[winIdx]}`;
  const verdictEmoji = isTie ? '⚖️' : '🏆';
  const verdictTitle = isTie
    ? 'הבדל קטן — ההחלטה תלויה בגורמים אישיים'
    : `${optNames[winIdx]} מתאים יותר`;
  const verdictSub = isTie
    ? `הפרש של פחות מחצי נקודה בין האפשרויות`
    : `ציון ${maxTotal.toFixed(1)} מול ${totals.filter((_,i)=>i!==winIdx).map(t=>t.toFixed(1)).join(' / ')}`;

  // Total score bars
  const totalBars = OPT_KEYS.slice(0, n).map((k, i) => `
    <div class="rpt-total-row">
      <span class="rpt-total-name" style="color:${optColors[i]}">${optLabels[i]} – ${optNames[i]}</span>
      <div class="rpt-total-track">
        <div class="rpt-total-fill ${k}" style="width:${totals[i]}%"></div>
      </div>
      <span class="rpt-total-val" style="color:${optColors[i]}">${totals[i].toFixed(1)}</span>
    </div>`).join('');

  // Per-topic score cards
  const scoreCards = CATEGORIES.filter(c => scores[c]).map((cat, idx) => {
    const s   = scores[cat];
    const pct = Math.round((s.weight || 0) * 100);
    const barRows = OPT_KEYS.slice(0, n).map((k, i) => {
      const val = s[k] || 0;
      return `
        <div class="rpt-bar-row">
          <span class="rpt-bar-lbl" style="color:${optColors[i]}">${optLabels[i]}</span>
          <div class="rpt-bar-track">
            <div class="rpt-bar-fill ${k}" style="width:${val*10}%;transition-delay:${idx*40}ms"></div>
          </div>
          <span class="rpt-bar-val" style="color:${optColors[i]}">${val}/10</span>
        </div>`;
    }).join('');
    return `
      <div class="rpt-score-card">
        <div class="rpt-score-head">
          <span class="rpt-score-name">${cat}</span>
          <span class="rpt-score-weight">משקל ${pct}%</span>
        </div>
        ${barRows}
        ${s.reason ? `<div class="rpt-reason">↳ ${s.reason}</div>` : ''}
      </div>`;
  }).join('');

  // Summary cards per option
  const summaryCards = OPT_KEYS.slice(0, n)
    .filter(k => reportData[`summary_${k}`])
    .map((k, i) => `
      <div class="rpt-summary-card s-${k}">
        <div class="rpt-summary-tag">${optLabels[i]} – ${optNames[i]}</div>
        <p>${reportData[`summary_${k}`]}</p>
      </div>`).join('');

  rv.innerHTML = `<div class="rpt">

    <div class="rpt-verdict ${verdictCls}">
      <div class="rpt-verdict-emoji">${verdictEmoji}</div>
      <div class="rpt-verdict-title">${verdictTitle}</div>
      <div class="rpt-verdict-sub">${verdictSub}</div>
    </div>

    <div class="rpt-section-label">ציון משוקלל כולל</div>
    <div class="rpt-totals">${totalBars}</div>

    ${summaryCards ? `
    <div class="rpt-section-label">סיכום לפי אפשרות</div>
    <div class="rpt-summaries">${summaryCards}</div>` : ''}

    ${reportData.key_tension || reportData.recommendation_note ? `
    <div class="rpt-section-label">ניתוח מעמיק</div>
    <div class="rpt-info-cards">
      ${reportData.key_tension ? `
      <div class="rpt-info-card tension">
        <div class="rpt-info-title">⚡ הדילמה המרכזית</div>
        <p>${reportData.key_tension}</p>
      </div>` : ''}
      ${reportData.recommendation_note ? `
      <div class="rpt-info-card advice">
        <div class="rpt-info-title">💡 המלצת היועץ</div>
        <p>${reportData.recommendation_note}</p>
      </div>` : ''}
    </div>` : ''}

    <div class="rpt-section-label">ציונים לפי תחום — ${Object.keys(scores).length} תחומים</div>
    <div class="rpt-scores">${scoreCards}</div>

    <div class="rpt-actions">
      <button class="rpt-btn-restart" onclick="restartConversation()">🔄 שיחה חדשה</button>
      <button class="rpt-btn-chat" onclick="scrollToChat()">💬 שאל שאלה נוספת</button>
    </div>
  </div>`;
}

function scrollToChat() {
  document.getElementById('report-view').classList.remove('visible');
  document.getElementById('messages').style.display = '';
  document.getElementById('input-bar').style.display = '';
  document.getElementById('user-input').focus();
  document.getElementById('messages').scrollTop = 9999;
}

function restartConversation() {
  messages   = [];
  scores     = {};
  reportData = {};
  appMode       = null;
  appOptions    = [];
  appDepth      = 'full';
  appWeightsMap = {};
  appPhase      = 'profile';
  appProfile    = null;
  SYSTEM_PROMPT = '';
  document.getElementById('phase-bar').style.display = 'none';
  document.getElementById('user-input').placeholder  = 'כתוב את תשובתך כאן...';
  // Reset CATEGORIES to base list (remove any custom topics added last session)
  CATEGORIES.splice(0, CATEGORIES.length,
    'איכות חיים','קהילה','חינוך','נגישות לעבודה','כלכלי',
    'בטחון אישי','תרבות ופנאי','בריאות','קרבה למשפחה וחברים');
  buildTopicsSidebar();
  document.getElementById('total-a').textContent     = '—';
  document.getElementById('total-b').textContent     = '—';
  document.getElementById('total-bar-a').style.width = '0';
  document.getElementById('total-bar-b').style.width = '0';
  document.getElementById('report-view').classList.remove('visible');
  document.getElementById('report-view').innerHTML   = '';
  document.getElementById('messages').style.display  = '';
  document.getElementById('input-bar').style.display = '';
  document.getElementById('messages').innerHTML      = '';
  // Delete old session data for this user so they start clean
  if (currentUsername) deleteSession(currentUsername);
  showWelcome();
}
</script>
